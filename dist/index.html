d:"tours",title:"Unique Tours",short:"Off-beat luxury camping & jeep safaris",tagline:"Designed for unique-minded travelers escaping city monotony for undiscovered, crowd-free Karakoram wilderness.",icon:vl,img:Yt(35302567),banner:Yt(19442083,1800,900),about:["This package is specially offered to unique-minded people who don't like running after hotel rooms, luxury beds, indoor services, air conditioning, etc., while taking a break from monotonous city life where all such facilities are already available. Most domestic tourists visiting Skardu & Gilgit-Baltistan are not newcomers — they are fed up with common crowded tourist spots and want to escape commercialized crowds.","If you agree with this unique idea, then this tour package is designed for you. This package is mainly a Luxury Camping Tour where you receive maximum luxury services at handpicked outdoor locations at an appropriate price. We have scouted some of the most beautiful undiscovered locations, mainly accessible with 4x4 Jeeps/Prados, with minimal or zero public traffic — allowing you to enjoy thousands of acres of natural mountain resort exclusively.","These tours are a rich mix of 4x4 Jeep safaris, luxury outdoor camping with or without day hikes, and comfortable hotel breaks after 1–2 days of wilderness camping."],includes:["4x4 Jeep / Prado safari transport for undiscovered tracks","High-altitude luxury tented setup with comfortable bedding","Private wilderness camp cook & hot outdoor meal service","Off-grid mountain location setup away from commercial crowds","Hotel breaks after 1–2 days of wilderness camping","Licensed native mountain guides & expedition staff","All area permits, entry passes & checkpoint arrangements","24/7 Skardu office support & safety coordination"],highlights:[{icon:vl,t:"Undiscovered Destinations",d:"Hand-picked secret locations accessible only by 4x4 with zero crowd traffic."},{icon:ku,t:"Luxury Outdoor Camping",d:"Maximum comfort in the wild — warm bedding, dining setup, and fresh hot meals."},{icon:ff,t:"4x4 Jeep Safaris",d:"Thrilling mountain drives through hidden valleys, high passes, and mountain lakes."},{icon:wu,t:"Jeep & Hike Hybrid",d:"A balanced mix of 4x4 safari, day hikes, luxury camping, and 1-2 day hotel breaks."}],stats:[["10+","Off-beat circuits"],["5–12","Days"],["2–6","Group size"],["May–Oct","Best season"]],tripIds:["unique-tormik-bilamik","unique-thallay-hushe","unique-deosai-minimarg","unique-astore-rattu","unique-basho-arandu","unique-katisho-deosai-7lakes","unique-fairy-meadows-deosai","unique-fairy-meadows-naltar-hunza","unique-rakaposhi-base-nagar","unique-naltar-minapin-kho"],fromPrice:65e3,season:"May – October",group:"2 – 6 guests",customRoutes:["Skardu – Tormik – Bilamik Thorsay – Talubroq","Skardu – Thallay Broq – Hanjor – Hushe Village","Skardu – Deosai – Gultari Shingo – Dhumail – Minimarg","Skardu – Astore – Parishing – Rattu Lake","Skardu – Shagarthang – Basho – Arandu Hotspring Shigar","Skardu – Katisho – Shila – Deosai Seven Lakes & Seven Peaks (with Day Hike)","Diamir – Fairy Meadows – Nanga Parbat – Rama Lake – Deosai – Skardu","Diamir – Fairy Meadows – Gilgit Naltar – Hunza","Fairy Meadows – Naltar – Rakaposhi Base (Nagar)","Naltar – Minapin – Kho Village – Hunza"],customRouteCards:[{id:"unique-tormik-bilamik",title:"Tormik & Bilamik Thorsay Pastures",route:"Skardu – Tormik – Bilamik Thorsay – Talubroq",tagline:"Off-grid 4x4 safari to alpine pastures and high meadow campsites.",img:"https://images.pexels.com/photos/1285625/pexels-photo-1285625.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=800&w=1200",duration:"5–7 Days",type:"4x4 Safari + Glamping"},{id:"unique-thallay-hushe",title:"Thallay Broq & Hushe Valley Pass",route:"Skardu – Thallay Broq – Hanjor – Hushe Village",tagline:"High Baltistan pass safari connecting Khaplu valley to Hushe K2 gateway.",img:"https://images.pexels.com/photos/31348069/pexels-photo-31348069.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=800&w=1200",duration:"6–8 Days",type:"
